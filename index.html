<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-title" content="asfinance" />
    <title>asfinance — Personal Finance</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('asfinance_theme_v1');
          var mode = t === 'light' ? 'light' : 'dark';
          var r = document.documentElement;
          r.classList.remove('dark', 'light');
          r.classList.add(mode);
          r.dataset.theme = mode;
          r.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#09090b] text-zinc-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
